name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        run: xvfb-run -a ./gradlew test plugin -Dsaltasmr.uiTest=true --no-daemon
      - name: Verify plugin archive
        run: python3 scripts/verify_spmod.py
      - uses: actions/upload-artifact@v4
        with:
          name: salt-asmr-plugin
          path: build/libs/*.spmod
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/test/
            build/ui-smoke.png
